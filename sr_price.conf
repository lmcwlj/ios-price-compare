# =============================================
# Shadowrocket 配置（添加到 [Script] 区）
# 文件: sr_price.conf
# =============================================

[Script]

# 京东比价
http-response ^https?:\/\/api\.m\.jd\.com\/client\.action\?functionId=(wareBusiness|getWareBusiness|getDetail|getJdPrice) requires-body=1,max-size=-1,script-path=https://raw.githubusercontent.com/你的用户名/你的仓库/main/jd_tb_price.js

# 淘宝/天猫比价
http-response ^https?:\/\/(.+)?\.(taobao|tmall)\.com\/(.+)? requires-body=1,max-size=-1,script-path=https://raw.githubusercontent.com/你的用户名/你的仓库/main/jd_tb_price.js

[MITM]
hostname = *.m.jd.com, *.taobao.com, *.tmall.com, api.m.jd.com
