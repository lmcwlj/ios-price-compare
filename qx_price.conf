; =============================================
; Quantumult X 比价配置
; 用于京东/淘宝/天猫商品比价
; =============================================

[rewrite_local]

; 京东 - 清理 HTTPDNS
^https?:\/\/api\.m\.jd\.com\/client\.action\?functionId=basicConfig url script-response-body jd_price.js

; 京东 - 商品详情注入比价
^https?:\/\/api\.m\.jd\.com\/client\.action\?functionId=wareBusiness url script-response-body jd_price.js

; 淘宝 - DNS劫持
^http://.+/amdc/mobileDispatch url script-request-body tb_price.js
^http://.+/amdc/mobileDispatch url script-response-body tb_price.js

; 淘宝 - 商品详情
^https?://trade-acs\.m\.taobao\.com/gw/mtop\.taobao\.detail\.getdetail url script-response-body tb_price.js

[mitm]
hostname = api.m.jd.com, trade-acs.m.taobao.com
